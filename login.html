<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to access your dashboard</p>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier" placeholder="Enter username or email" />
        <div class="field-error" id="identifierError"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" />
        <div class="field-error" id="passwordError"></div>
      </div>

      <button type="submit" class="btn-primary">Login</button>
    </form>

    <p class="switch-link">Don't have an account? <a href="register.html">Register here</a></p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
