<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    <p class="subtitle">Sign up to get started</p>

    <div id="alertBox" class="alert"></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" />
        <div class="field-error" id="usernameError"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" />
        <div class="field-error" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters, 1 number" />
        <div class="field-error" id="passwordError"></div>
        <div class="hint">Must be at least 8 characters and include at least 1 number.</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" />
        <div class="field-error" id="confirmError"></div>
      </div>

      <button type="submit" class="btn-primary">Register</button>
    </form>

    <p class="switch-link">Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
